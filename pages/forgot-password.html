<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khôi phục mật khẩu - VolunteerLink</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="khung-a">

  <header class="khung-a-header">
    <div class="khung-a-header-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-logo-icon">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.5 1 9.2-1.3 7.3-6.5 8.8-9 8.8Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
        </div>
        <span>Volunteer<span class="brand-accent">Link</span></span>
      </a>
      <a href="login.html" class="btn btn-outline btn-sm">Quay lại Đăng nhập</a>
    </div>
  </header>

  <main class="khung-a-main">
    <div class="khung-a-center-box" style="max-width: 460px;">
      <div style="text-align: center; margin-bottom: 22px;">
        <h2 style="color: var(--text-main); font-weight: 800; margin-bottom: 6px;">Quên Mật Khẩu?</h2>
        <p style="font-size: 0.88rem; color: var(--text-muted);">Nhập email đã đăng ký để nhận mã khôi phục mật khẩu</p>
      </div>

      <form id="forgotForm" onsubmit="event.preventDefault(); showToast('Đã gửi liên kết khôi phục tới email của bạn!', 'success'); setTimeout(() => window.location.href='login.html', 1500);">
        <div class="form-group">
          <label class="form-label" for="resetEmail">Địa chỉ Email</label>
          <input type="email" id="resetEmail" class="form-control" placeholder="vidu@volunteerlink.vn" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 18px; padding: 11px;">
          Gửi Liên Kết Khôi Phục
        </button>
      </form>
    </div>
  </main>

  <footer class="khung-a-footer">
    <div>VolunteerLink &copy; 2026 - Nền tảng kết nối tình nguyện cộng đồng</div>
  </footer>

  <script src="../js/utils.js"></script>
</body>
</html>
