<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khôi phục mật khẩu - VolunteerLink</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="khung-a">

  <header class="khung-a-header">
    <div class="khung-a-header-inner">
      <a href="home.html" class="brand-logo">
        <div class="brand-logo-icon">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.5 1 9.2-1.3 7.3-6.5 8.8-9 8.8Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
        </div>
        <span>Volunteer<span class="brand-accent">Link</span></span>
      </a>
      <a href="login.html" class="btn btn-outline btn-sm">Quay lại Đăng nhập</a>
    </div>
  </header>

  <main class="khung-a-main">
    <div class="khung-a-center-box auth-box">
      <div class="auth-header">
        <h1 id="forgotPageTitle">Quên Mật Khẩu</h1>
        <p id="forgotPageSubtitle">Nhập email đã đăng ký để nhận liên kết đặt lại mật khẩu</p>
      </div>

      <div id="forgotStatusBox" class="alert" role="status" style="display: none; margin-bottom: 16px;"></div>

      <form id="forgotEmailForm" style="display: flex; flex-direction: column; gap: 14px;">
        <div class="form-group">
          <label class="form-label" for="forgotEmailInput">Email đăng ký</label>
          <input type="email" id="forgotEmailInput" class="form-control" placeholder="example@email.com" required autocomplete="email">
        </div>
        <button type="submit" id="forgotSubmitBtn" class="btn btn-primary btn-block">Gửi liên kết đặt lại mật khẩu</button>
      </form>

      <form id="resetPasswordForm" style="display: none; flex-direction: column; gap: 14px;">
        <div class="form-group">
          <label class="form-label" for="resetNewPasswordInput">Mật khẩu mới</label>
          <input type="password" id="resetNewPasswordInput" class="form-control" minlength="8" maxlength="72" placeholder="Nhập mật khẩu mới" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="resetConfirmPasswordInput">Xác nhận mật khẩu mới</label>
          <input type="password" id="resetConfirmPasswordInput" class="form-control" minlength="8" maxlength="72" placeholder="Nhập lại mật khẩu mới" required autocomplete="new-password">
        </div>
        <button type="submit" id="resetSubmitBtn" class="btn btn-primary btn-block">Cập nhật mật khẩu mới</button>
      </form>

      <div class="system-state-actions" style="margin-top: 16px;">
        <a href="login.html" class="btn btn-outline btn-block">Quay lại Đăng nhập</a>
      </div>
    </div>
  </main>

  <footer class="khung-a-footer">
    <div><strong>VolunteerLink</strong> &copy; 2026 - Nền tảng kết nối tình nguyện cộng đồng</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/forgot_password.js"></script>
</body>
</html>
