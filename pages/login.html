<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - VolunteerLink</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .preset-roles-card {
      margin-top: 20px;
      padding: 16px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      text-align: left;
    }
    .preset-roles-title {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .preset-roles-btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-role-preset {
      flex: 1;
      min-width: 120px;
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.15s ease;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .btn-role-preset small {
      font-size: 10.5px;
      font-weight: normal;
      color: #64748b;
    }
    .btn-role-user { border-color: #a7f3d0; color: #065f46; }
    .btn-role-user:hover { background: #ecfdf5; }
    .btn-role-org { border-color: #bfdbfe; color: #1e40af; }
    .btn-role-org:hover { background: #eff6ff; }
    .btn-role-admin { border-color: #e9d5ff; color: #6b21a8; }
    .btn-role-admin:hover { background: #faf5ff; }
  </style>
</head>
<body class="khung-a">

  <header class="khung-a-header">
    <div class="khung-a-header-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-logo-icon">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.5 1 9.2-1.3 7.3-6.5 8.8-9 8.8Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
        </div>
        <span>Volunteer<span class="brand-accent">Link</span></span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm" style="gap: 6px;">
        <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Quay lại Trang chủ
      </a>
    </div>
  </header>

  <main class="khung-a-main">
    <div class="khung-a-center-box" style="max-width: 500px;">
      <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="color: var(--text-main); font-weight: 800; margin-bottom: 6px; letter-spacing: -0.02em;">Đăng Nhập</h2>
      </div>

      <!-- Khung thông báo lỗi đăng nhập (khi đăng nhập sai hoặc lỗi Backend) -->
      <div id="loginAlert" class="alert alert-danger" style="display: none;">
        <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24" style="flex-shrink: 0; width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2;">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="loginAlertText">Email hoặc mật khẩu không chính xác!</span>
      </div>
      
      <form id="loginForm" novalidate style="margin-top: 18px;">
        <div class="form-group" id="emailGroup">
          <label class="form-label" for="loginEmail">Địa chỉ Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="vidu@volunteerlink.vn" required />
          <div class="form-error" id="emailError">Vui lòng nhập email hợp lệ.</div>
        </div>

        <div class="form-group" id="passwordGroup">
          <div class="flex-between">
            <label class="form-label" for="loginPassword">Mật khẩu</label>
            <a href="forgot-password.html" style="font-size: 0.78rem;">Quên mật khẩu?</a>
          </div>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required />
          <div class="form-error" id="passwordError">Mật khẩu tối thiểu 8 ký tự.</div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 18px; padding: 12px; font-weight: 700;">
          Đăng Nhập
        </button>
      </form>

      <!-- Tài khoản mẫu Backend để điền nhanh -->
      <div class="preset-roles-card">
        <div class="preset-roles-title">
          <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24" style="width: 14px; height: 14px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          Tài khoản mẫu Backend (Bấm để điền nhanh)
        </div>
        <div class="preset-roles-btn-group">
          <button type="button" class="btn-role-preset btn-role-user" onclick="quickFillRole('USER')">
            <span>Tình nguyện viên</span>
            <small>user@gmail.com</small>
          </button>
          <button type="button" class="btn-role-preset btn-role-org" onclick="quickFillRole('ORGANIZER')">
            <span>Nhà tổ chức</span>
            <small>organizer@gmail.com</small>
          </button>
          <button type="button" class="btn-role-preset btn-role-admin" onclick="quickFillRole('ADMIN')">
            <span>Quản trị viên</span>
            <small>admin@gmail.com</small>
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 18px; font-size: 0.85rem;">
        Chưa có tài khoản? <a href="register.html" style="font-weight: 600;">Đăng ký ngay</a>
      </div>
    </div>
  </main>

  <footer class="khung-a-footer">
    <div>VolunteerLink &copy; 2026 - Nền tảng kết nối tình nguyện cộng đồng</div>
  </footer>

  <!-- Thư viện Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>

  <!-- Cấu hình API -->
  <script src="../js/config.js"></script>

  <!-- Axios Client -->
  <script src="../js/api.js"></script>

  <!-- Dữ liệu mẫu & Service -->
  <script src="../js/data_store.js"></script>

  <!-- Hàm tiện ích -->
  <script src="../js/utils.js"></script>

  <!-- Quản lý Authentication -->
  <script src="../js/auth.js"></script>

  <!-- Xử lý form đăng nhập -->
  <script src="../js/login.js"></script>

</body>
</html>
