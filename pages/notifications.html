<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông báo - VolunteerLink</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/notifications.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="khung-a">
  <header id="app-header" class="khung-a-header"></header>

  <main class="khung-a-main">
    <div class="vl-notification-inbox" id="notificationInbox" style="margin-top: 0;">
      <a id="notificationDashboard" href="home.html" class="btn btn-outline btn-sm" style="margin-bottom: 16px;">← Về bảng điều khiển</a>
      <h1 style="font-size: 1.65rem; font-weight: 800; color: var(--text-main); margin: 0 0 18px;">Tất cả thông báo</h1>
      <section class="vl-notification-panel" aria-label="Danh sách thông báo">
        <div class="vl-notification-heading">
          <strong id="notificationUnreadCount" aria-live="polite">Thông báo</strong>
          <button type="button" id="notificationReadAll" class="vl-notification-read-all">Đọc tất cả</button>
        </div>
        <div id="notificationList" tabindex="-1" aria-live="polite">
          <div class="vl-notification-empty">Đang tải thông báo...</div>
        </div>
        <div class="vl-notification-footer">
          <button type="button" id="notificationPrevious" disabled>Trang trước</button>
          <button type="button" id="notificationRefresh" class="btn btn-outline btn-sm org-icon-btn" aria-label="Làm mới danh sách thông báo" title="Làm mới">
            <svg class="svg-icon" aria-hidden="true" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
          <button type="button" id="notificationNext" disabled>Trang sau</button>
        </div>
      </section>
    </div>
  </main>

  <footer id="app-footer" class="khung-a-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/notifications.js"></script>
</body>
</html>
